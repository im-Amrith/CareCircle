name: test
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  orchestrator:
    # Mock mode only: no AWS credentials, no Bedrock or Polly calls.
    runs-on: ubuntu-latest
    env:
      MOCK_AWS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: alexa-sim/orchestrator/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: alexa-sim/orchestrator
      - run: pytest -q
        working-directory: alexa-sim/orchestrator

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa-sim/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alexa-sim/web/package-lock.json
      - run: npm ci
      - run: npm run build
